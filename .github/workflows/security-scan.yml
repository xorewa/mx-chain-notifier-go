name: Security scan

on:
  pull_request:
    branches: [NewArc]
  push:
    branches: [NewArc]

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck (${{ matrix.scope.name }})
    runs-on: ubuntu-22.04
    env:
      GOTOOLCHAIN: go1.26.5
    strategy:
      fail-fast: false
      matrix:
        scope:
          - name: production-command
            package: ./cmd/notifier
          - name: complete-repository
            package: ./...

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go 1.26.5
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.5
          cache: true

      - name: Install pinned govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0

      - name: Scan ${{ matrix.scope.name }}
        shell: bash
        run: |
          set -o pipefail
          govulncheck -show verbose "${{ matrix.scope.package }}" 2>&1 | tee "govulncheck-${{ matrix.scope.name }}.txt"

      - name: Retain scan evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: govulncheck-${{ matrix.scope.name }}-${{ github.sha }}
          path: govulncheck-${{ matrix.scope.name }}.txt
          if-no-files-found: error
          retention-days: 90
